[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-linux"
version = "1.0.0"
description = "A universal Linux package-manager frontend and environment layer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "techmaster2013"}
]

[project.scripts]
pack = "pack.cli:main"

[tool.setuptools.packages.find]
include = ["pack*"]
